name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    # Apple Silicon: Metal is the only accelerator wired up, and the llama.cpp
    # build below assumes it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # llama.cpp is a cmake dependency built once and linked statically. Cached
      # because it dominates a cold build.
      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: build/llama.cpp
          key: llama-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
      - name: Build llama.cpp
        run: zig build llama-cpp

      - name: zig build test
        run: zig build test --summary all
      - name: zig build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      # No model and no index in CI: 609 MiB per run is not worth it. This
      # covers the paths that must work on a machine that has neither, and
      # asserts the exit codes those paths promise — "no index yet" is a
      # distinct, actionable outcome, not a crash and not success.
      - name: smoke
        env:
          ZKB_HOME: ${{ runner.temp }}/zkb-smoke
        run: |
          set -u
          bin=./zig-out/bin/zkb

          "$bin" version | grep -q '^zkb '

          # Work without any state at all.
          "$bin" skill | head -1 | grep -q '^---$'
          "$bin" facts  > /dev/null

          # doctor's job is to report what is missing, so on a runner with no
          # model it must fail — and fail for that reason alone. Asserting the
          # count catches a regression in any of the other checks, which a bare
          # "run it and ignore the status" would hide.
          rc=0
          doc=$("$bin" doctor 2>&1) || rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: doctor without a model should exit 1, got $rc"; echo "$doc"; exit 1; }
          grep -q 'model not found'   <<<"$doc" || { echo "FAIL: expected the model check to fail"; echo "$doc"; exit 1; }
          grep -q 'zkb model pull'    <<<"$doc" || { echo "FAIL: doctor should say how to fix it"; exit 1; }
          n=$(grep -c '^  FAIL' <<<"$doc")
          [ "$n" -eq 1 ] || { echo "FAIL: expected exactly 1 failed check, got $n"; echo "$doc"; exit 1; }

          # The first thing a new install does. Without a model the daemon
          # cannot serve, so start must say so and name the fix rather than
          # spending five seconds waiting for a process that already exited.
          # This also covers run/ being created: before that fix the failure
          # here was a bare FileNotFound, which this assertion would not accept.
          rc=0
          out=$("$bin" daemon start 2>&1) || rc=$?
          [ "$rc" -eq 3 ] || { echo "FAIL: daemon start without a model should exit 3, got $rc"; echo "$out"; exit 1; }
          grep -q 'zkb model pull' <<<"$out" || { echo "FAIL: daemon start should name the fix"; echo "$out"; exit 1; }

          # Report a missing index as exit 3 with something to act on, rather
          # than failing or pretending to succeed.
          for cmd in records status; do
            rc=0
            out=$("$bin" "$cmd" 2>&1) || rc=$?
            [ "$rc" -eq 3 ] || { echo "FAIL: $cmd expected exit 3, got $rc"; exit 1; }
            grep -q 'zkb index' <<<"$out" || { echo "FAIL: $cmd should say what to run"; exit 1; }
          done

          # A named root with filters has to actually select files and then stay
          # registered. Both halves used to be broken in ways that reported
          # success: the root never reached the daemon, and nothing rescanned a
          # collection once it had been scanned. Asserting the exact seen count
          # is what catches a dropped filter, which otherwise just looks like
          # more results than you expected.
          tree=$(mktemp -d)
          mkdir -p "$tree/p1/memory" "$tree/p1/junk"
          printf '# kept\n'    > "$tree/p1/memory/a.md"
          printf '# excluded\n' > "$tree/p1/junk/b.md"
          printf 'noise\n'      > "$tree/p1/memory/c.txt"
          rc=0
          out=$("$bin" index --collection sel --root "$tree" --include '*/memory/*.md' --ext md 2>&1) || rc=$?
          # 4 is "model not found", which happens after the scan this asserts on.
          [ "$rc" -eq 4 ] || { echo "FAIL: index expected exit 4, got $rc"; echo "$out"; exit 1; }
          grep -q 'seen 1,' <<<"$out" || { echo "FAIL: --include/--ext should select exactly 1 of 3 files"; echo "$out"; exit 1; }

          out=$("$bin" status 2>&1) || { echo "FAIL: status after an index"; echo "$out"; exit 1; }
          grep -q 'sel' <<<"$out" || { echo "FAIL: the registered collection is missing"; echo "$out"; exit 1; }
          grep -q "matching \*/memory/\*.md" <<<"$out" || { echo "FAIL: status should show why the count is 1"; echo "$out"; exit 1; }

          # Disjoint roots would make the collection root '/'. Refusing beats
          # walking the filesystem and looking like a hang.
          rc=0
          out=$("$bin" index --collection bad --root /opt --root /var 2>&1) || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: disjoint roots should be refused with exit 2, got $rc"; echo "$out"; exit 1; }

          # .zkbignore, with the repo's own .gitignore respected from above the
          # collection root. Both were shipped as gitignore-compatible, so the
          # exact seen count is the assertion that matters.
          igroot=$(mktemp -d)
          ( cd "$igroot" && git init -q . && git config core.excludesfile /dev/null )
          mkdir -p "$igroot/docs/notes" "$igroot/docs/drafts"
          printf '# keep\n'   > "$igroot/docs/top.md"
          printf '# keep\n'   > "$igroot/docs/notes/a.md"
          printf '# drop\n'   > "$igroot/docs/drafts/d.md"
          printf 'noise\n'    > "$igroot/docs/notes/x.log"
          printf 'docs/drafts/\n*.log\n' > "$igroot/.gitignore"
          rc=0
          out=$("$bin" index --collection ig --root "$igroot/docs" --ext md --ext log 2>&1) || rc=$?
          [ "$rc" -eq 4 ] || { echo "FAIL: index expected exit 4, got $rc"; echo "$out"; exit 1; }
          grep -q 'seen 2,' <<<"$out" || { echo "FAIL: ancestor .gitignore should leave 2 of 4 files"; echo "$out"; exit 1; }

          # .zkbignore overrides .gitignore, because it loads after it.
          printf '!drafts/\n' > "$igroot/docs/.zkbignore"
          rc=0
          out=$("$bin" index --collection ig2 --root "$igroot/docs" --ext md --ext log 2>&1) || rc=$?
          grep -q 'seen 3,' <<<"$out" || { echo "FAIL: !drafts/ should re-include the gitignored directory"; echo "$out"; exit 1; }

          # A collection has to be removable; it was not, and that cost a rebuild.
          out=$("$bin" collection rm ig2 2>&1) || { echo "FAIL: collection rm"; echo "$out"; exit 1; }
          grep -q 'untouched' <<<"$out" || { echo "FAIL: rm should say the files survive"; echo "$out"; exit 1; }
          "$bin" status 2>&1 | grep -q ' ig2 ' && { echo "FAIL: ig2 still listed"; exit 1; }
          rc=0
          out=$("$bin" collection rm memory 2>&1) || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: dropping a built-in should exit 2, got $rc"; exit 1; }

          # The LaunchAgent label changed in 0.0.16, so install has to clean up the
          # old plist. Leaving it behind means two launchd agents for one index.
          fakehome=$(mktemp -d)
          mkdir -p "$fakehome/Library/LaunchAgents"
          : > "$fakehome/Library/LaunchAgents/io.zkb.daemon.plist"
          out=$(HOME="$fakehome" "$bin" daemon install 2>&1) || { echo "FAIL: daemon install"; echo "$out"; exit 1; }
          [ -f "$fakehome/Library/LaunchAgents/io.github.agent-rt.zkb.daemon.plist" ] || { echo "FAIL: new plist missing"; echo "$out"; exit 1; }
          [ -f "$fakehome/Library/LaunchAgents/io.zkb.daemon.plist" ] && { echo "FAIL: legacy plist left behind"; exit 1; }
          grep -q 'io.github.agent-rt.zkb.daemon' "$fakehome/Library/LaunchAgents/io.github.agent-rt.zkb.daemon.plist" || { echo "FAIL: label not in plist"; exit 1; }

          # And uninstall has to know about the old one, for a machine that
          # upgraded without re-running install.
          : > "$fakehome/Library/LaunchAgents/io.zkb.daemon.plist"
          out=$(HOME="$fakehome" "$bin" daemon uninstall 2>&1) || { echo "FAIL: daemon uninstall"; echo "$out"; exit 1; }
          n=$(ls "$fakehome/Library/LaunchAgents" | wc -l | tr -d ' ')
          [ "$n" -eq 0 ] || { echo "FAIL: $n plist(s) left after uninstall"; exit 1; }
